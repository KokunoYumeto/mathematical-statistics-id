  <title id="title">Distribusi variabel pivot dan pembagian peluang kedua ekor</title>
  <desc id="desc">Kurva kepadatan V dari X dan theta. Daerah tengah berpeluang satu dikurangi alfa; ekor kiri berpeluang satu dikurangi p kali alfa dan ekor kanan berpeluang p kali alfa.</desc>
  <metadata>Redraw Bahasa Indonesia derived from Random interval/Tails.png, frozen SHA-256 4da888c59b35bc53fa57ba60e4daf8c9897b2db3bd9bd479c2add5bb4e4177dc. The source's lambda label is corrected to theta. OpenAI Codex gpt-5.6-sol, Ultra.</metadata>
